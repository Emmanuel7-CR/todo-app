<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Application</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  
</head>
<body>
  <header>
    <ul>
      <li class="nav">Todo App</li>
      <li class="nav search" id="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 512 512">
          <path fill="#ffffff" d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 
            12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 
            40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 
            352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
        </svg>
      </li>
      <li class="nav">
  <button id="settings-btn" aria-label="App settings">⚙️</button>
</li>
      <!--
      <li class="nav">
  <button id="export-btn" aria-label="Export tasks">📤</button>
</li>
<li class="nav">
  <button id="import-btn" aria-label="Import tasks">📥</button>
  <input type="file" id="import-input" accept=".json" style="display: none;" />
</li> -->
    </ul>
  </header>

  <div class="wrapper" id="search-wrapper">
    <input type="search" id="search-input" autocomplete="off" placeholder="Search task" />
  </div>

  <div id="progress-summary" class="progress-summary"></div>
  <div id="form-container"></div>
  <div id="todo-list"></div>

  <!-- ✅ Use a BUTTON not a LI for proper event handling -->
<div class="new-todo-btn">
  <button id="add-btn" aria-label="Add Task">
    <svg xmlns="http://www.w3.org/2000/svg" height="20" width="17.5" viewBox="0 0 448 512">
      <path fill="#ffffff" d="M256 80c0-17.7-14.3-32-32-32s-32 
        14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 
        32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 
        32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 
        0 0-144z" />
    </svg>
  </button>
</div>

<!-- View Task Modal -->
<div id="view-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h2 id="view-title"></h2>
    
    <div class="detail-section">
      <div class="detail-label">Description</div>
      <div id="view-description" class="detail-content"></div>
    </div>
    
    <div class="detail-section">
      <div class="detail-label">Due Date</div>
      <div id="view-due-date" class="detail-content"></div>
    </div>
    
    <div class="detail-section">
      <div class="detail-label">Status</div>
      <div id="view-status" class="detail-content"></div>
    </div>
    
    <button id="view-close">Close</button>
  </div>
</div>

  <!-- Delete Confirmation Modal -->
 <div id="confirm-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-content">
    <p id="modal-title">Are you sure you want to delete this task?</p>
    <div class="modal-buttons">
      <button id="confirm-yes">Yes</button>
      <button id="confirm-no">Cancel</button>
    </div>
  </div>
</div>

 <button id="install-button" style="display: none;" aria-label="Install App">
  📲
  <span class="tooltip">Install App</span>
</button>

 <!-- Settings Modal -->
<div id="settings-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="modal-content" style="width: 90%; max-width: 400px;">
    <h3 id="settings-title">Settings</h3>
    
    <label style="display: block; margin: 12px 0;">
      <input type="checkbox" id="sound-toggle" /> 
      Enable reminder sound
    </label>

    <label style="display: block; margin: 12px 0;">
      Notify me 
      <select id="lead-time" style="margin: 0 6px; padding: 4px; background: var(--primary-color); color: var(--text-color); border: 1px solid var(--secondary-color);">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="30">30</option>
        <option value="60">60</option>
      </select>
      minutes before task is due
    </label>

    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
      <button id="settings-save">Save</button>
      <button id="settings-cancel">Close</button>
    </div>
  </div>
</div>
  <!-- ✅ Defer script until after DOM is ready -->
  <script type="module" src="script.js"></script>
</body>
</html>
